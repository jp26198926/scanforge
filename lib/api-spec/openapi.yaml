openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: generator
    description: QR code and barcode generation
  - name: account
    description: Account usage and plan information
  - name: billing
    description: PayPal subscription billing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate:
    post:
      operationId: generateCode
      tags: [generator]
      summary: Generate a QR code or barcode
      description: Creates a generation transaction after enforcing the caller's daily plan limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "201":
          description: Generated code transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Generation"
        "403":
          description: Plan limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /usage:
    get:
      operationId: getUsage
      tags: [account]
      summary: Get today's usage and plan limits
      responses:
        "200":
          description: Current plan and usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
  /generations:
    get:
      operationId: listGenerations
      tags: [generator]
      summary: List recent generation history
      responses:
        "200":
          description: Recent generations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Generation"
  /generations/{id}/asset:
    post:
      operationId: saveGenerationAsset
      tags: [generator]
      summary: Save a generated asset to Cloudinary
      description: Uploads a browser-generated SVG or PNG for an authenticated generation owner.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUploadInput"
      responses:
        "201":
          description: Generation with its durable Cloudinary asset URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Generation"
        "400":
          description: Invalid asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Generation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Cloudinary upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Cloudinary is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans:
    get:
      operationId: listPlans
      tags: [account]
      summary: List subscription plans
      responses:
        "200":
          description: Available plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
  /billing/basic:
    get:
      operationId: getBasicSubscription
      tags: [billing]
      summary: Get the signed-in account's Basic subscription status
      responses:
        "200":
          description: Current subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
  /billing/basic/checkout:
    post:
      operationId: createBasicCheckout
      tags: [billing]
      summary: Create a PayPal checkout for the Basic plan
      description: Creates a $5/month PayPal subscription and returns its approval URL.
      responses:
        "201":
          description: PayPal checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: PayPal request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: PayPal is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /billing/basic/cancel:
    post:
      operationId: cancelBasicSubscription
      tags: [billing]
      summary: Cancel the signed-in account's Basic subscription
      description: Cancels the remote PayPal subscription and returns the account to the Starter plan.
      responses:
        "200":
          description: Subscription cancellation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: PayPal request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: PayPal is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /billing/paypal/webhook:
    post:
      operationId: handlePaypalWebhook
      tags: [billing]
      summary: Process a signed PayPal subscription webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaypalWebhookInput"
      responses:
        "200":
          description: Webhook accepted
        "400":
          description: Invalid webhook signature or event
        "503":
          description: PayPal webhook verification is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    GenerateInput:
      type: object
      properties:
        format:
          type: string
          enum: [qrcode, barcode]
        value:
          type: string
          minLength: 1
        entries:
          type: array
          items:
            type: string
        options:
          type: object
          properties:
            width:
              type: number
              minimum: 256
              maximum: 4096
            height:
              type: number
              minimum: 256
              maximum: 4096
            foreground:
              type: string
            background:
              type: string
            errorCorrection:
              type: string
              enum: [L, M, Q, H]
          required: [width, height]
      required:
        - format
        - options
    Generation:
      type: object
      properties:
        id:
          type: string
        format:
          type: string
          enum: [qrcode, barcode]
        value:
          type: string
        entryCount:
          type: number
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ready, processing]
        assetUrl:
          type: ["string", "null"]
      required: [id, format, value, entryCount, createdAt, status, assetUrl]
    AssetUploadInput:
      type: object
      properties:
        asset:
          type: string
          minLength: 1
        format:
          type: string
          enum: [svg, png]
      required: [asset, format]
    UsageSummary:
      type: object
      properties:
        plan:
          type: string
          enum: [anonymous, starter, basic, admin]
        dailyLimit:
          type: number
        usedToday:
          type: number
        remainingToday:
          type: number
        isAuthenticated:
          type: boolean
        resetAt:
          type: string
          format: date-time
      required: [plan, dailyLimit, usedToday, remainingToday, isAuthenticated, resetAt]
    Plan:
      type: object
      properties:
        id:
          type: string
          enum: [anonymous, starter, basic, admin]
        name:
          type: string
        price:
          type: number
        interval:
          type: string
          enum: [none, monthly]
        dailyLimit:
          type: number
        description:
          type: string
        highlighted:
          type: boolean
      required: [id, name, price, interval, dailyLimit, description, highlighted]
    SubscriptionStatus:
      type: object
      properties:
        plan:
          type: string
          enum: [starter, basic]
        status:
          type: string
          enum: [inactive, pending, active, error]
        configured:
          type: boolean
        subscriptionId:
          type: ["string", "null"]
        approvalUrl:
          type: ["string", "null"]
        message:
          type: ["string", "null"]
      required: [plan, status, configured, subscriptionId, approvalUrl, message]
    CheckoutResponse:
      type: object
      properties:
        plan:
          type: string
          enum: [basic]
        status:
          type: string
          enum: [pending, active]
        subscriptionId:
          type: string
        approvalUrl:
          type: ["string", "null"]
        message:
          type: string
      required: [plan, status, subscriptionId, approvalUrl, message]
    PaypalWebhookInput:
      type: object
      additionalProperties: true

